# =============================================================================
# Production Profile Configuration (application-prod.properties)
# Activate via: --spring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# =============================================================================

server.port=${PORT:8080}

# Database Configuration (Injected from Environment Variables)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JPA / Hibernate Production Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Security Configuration (Injected from Environment Variables)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins (Fallback to http://localhost:5173 for local dev)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
